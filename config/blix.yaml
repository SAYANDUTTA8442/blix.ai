# Blix v0.2 configuration
# All keys are optional — env vars (.env) override these,
# and both override the coded defaults.

llm:
  provider: "transformers"                    # "transformers" | "ollama"
  model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  ollama_model: "llama3.2"
  temperature: 0.7
  max_new_tokens: 512

embed:
  model: "all-MiniLM-L6-v2"
  threshold: 0.35
  top_k: 5

memory:
  recent_k: 3
  fuzzy_top_k: 3
  fuzzy_threshold: 60.0
  keyword_top_k: 3
  auto_extract: true

debug: false
